<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Misbah ♥</title>
<style>
:root{
  --P:360px;--k:1;
  --ink:#6f4f9a;--ink2:#8b6bb5;--cream:#fbf3ea;--lil:#e5daf2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
body{
  background-color:#f8efe4;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    conic-gradient(#e6dbf1 25%,transparent 0 50%,#e6dbf1 0 75%,transparent 0);
  background-size:160px 160px,96px 96px;
}
.stage{position:fixed;inset:0;padding:56px 12px 94px;display:grid;place-items:center;perspective:2600px}
.book{position:relative;width:calc(var(--P)*2);height:calc(var(--P)*1.4097);flex:none;
  transform-style:preserve-3d;transform:scale(var(--k)) translateX(calc(var(--P)*-.5));
  transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.book.open{transform:scale(1) translateX(0)}
.pg{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background:#f3ebf8 center/100% 100% no-repeat}
.pageR{left:50%;border-radius:2px 8px 8px 2px;box-shadow:0 14px 34px rgba(90,60,120,.28)}
.pageL{left:0;border-radius:8px 2px 2px 8px;box-shadow:0 14px 34px rgba(90,60,120,.28);opacity:0;pointer-events:none;overflow:visible;background:none}
.pageL.show{opacity:1;pointer-events:auto}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transform:translateZ(1px);transition:transform 1.1s cubic-bezier(.55,.05,.3,1);cursor:pointer}
.leaf.open{transform:translateZ(1px) rotateY(-180deg);cursor:default}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:center/100% 100% no-repeat;
  border-radius:2px 8px 8px 2px;box-shadow:0 14px 34px rgba(90,60,120,.3)}
.face.back{transform:rotateY(180deg);border-radius:8px 2px 2px 8px}
.leaf.hidden{visibility:hidden}
.spine{position:absolute;left:50%;top:0;height:100%;width:30px;margin-left:-15px;pointer-events:none;opacity:0;transition:opacity .6s .5s;
  background:linear-gradient(90deg,transparent,rgba(80,50,110,.22) 50%,transparent);transform:translateZ(2px)}
.book.open .spine{opacity:1}
/* left page: envelope + letter */
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.pageL .base{border-radius:8px 2px 2px 8px}
.letter{position:absolute;left:13.2%;top:18.75%;width:47.6%;cursor:pointer;z-index:2;
  transform-origin:50% 50%;transition:transform .8s cubic-bezier(.4,.05,.2,1),clip-path .8s cubic-bezier(.4,.05,.2,1),filter .8s;
  clip-path:polygon(3.9% -11.7%,103% 55.2%,4.3% 123.5%,4.3% 123.5%)}
.letter img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.letter.top{z-index:4}
.letter.up{transform:translate(27.3%,8.2%) scale(1.555);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
  filter:drop-shadow(0 10px 18px rgba(70,40,100,.35))}
.front{z-index:3}
.tip{position:absolute;left:0;right:0;bottom:2.2%;text-align:center;font-size:max(11px,calc(var(--P)/34));font-style:italic;color:var(--ink2);z-index:5;pointer-events:none;
  text-shadow:0 0 6px #fff,0 0 6px #fff;transition:opacity .4s}
/* right page: candles */
.cake{position:absolute;inset:0}
.fl{position:absolute;pointer-events:none;will-change:transform,opacity;transition:opacity .22s}
.fl img{display:block;width:100%;height:auto}
.smoke{position:absolute;pointer-events:none;width:9%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(185,165,210,.55),rgba(185,165,210,0) 70%);animation:smoke 1.6s ease-out forwards}
@keyframes smoke{from{transform:translate(-50%,0) scale(.4);opacity:.9}to{transform:translate(-30%,-260%) scale(2);opacity:0}}
.wish{position:absolute;left:12%;right:12%;top:65%;height:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%;
  text-align:center;opacity:0;pointer-events:none;transition:opacity .6s;z-index:6}
.wish.show{opacity:1;pointer-events:auto}
.wish h2{margin:0;white-space:nowrap;font-size:max(15px,calc(var(--P)/16));font-style:italic;font-weight:700;line-height:1.1;color:var(--ink);text-shadow:0 0 8px #fff,0 0 8px #fff}
.btn{font:inherit;font-size:max(12px,calc(var(--P)/30));color:var(--ink);background:#fbf3ea;border:2px dashed var(--ink2);border-radius:999px;padding:.55em 1.2em;cursor:pointer;
  box-shadow:2px 3px 0 rgba(139,107,181,.35);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active,.btn.on{transform:translateY(2px);box-shadow:0 1px 0 rgba(139,107,181,.35);background:#efe5fa}
/* chrome */
.back-btn{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:20;opacity:0;pointer-events:none;transition:opacity .4s}
.back-btn.show{opacity:1;pointer-events:auto;transition-delay:.9s}
.hint{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;font-style:italic;font-size:17px;color:var(--ink2);transition:opacity .4s;z-index:10;pointer-events:none}
.hint.hide{opacity:0}
.dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:20;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;
  display:flex;flex-direction:column;align-items:center;gap:7px;width:min(92vw,460px)}
.dock.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);transition-delay:1s}
.dock .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.meter{position:relative;width:130px;height:14px;border-radius:99px;background:#fbf3ea;border:2px solid var(--ink2);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#c9b3e6,#8b6bb5)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:#6f4f9a;opacity:.55}
.meter-l{font-size:13px;font-style:italic}
.note{font-size:12.5px;font-style:italic;text-align:center;min-height:16px;color:var(--ink2);text-shadow:0 0 5px #f8efe4,0 0 5px #f8efe4}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.book,.leaf{transition-duration:.01s}}
</style>
</head>

var book=$('book'),leaf=$('leaf'),pageL=$('pageL'),letter=$('letter'),cake=$('cake'),

/* ---------- layout ---------- */
function layout(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var availH=vh-200,P=Math.min((vw-24)/2,availH/1.4097,700);
  P=Math.max(P,120);
  var H=P*1.4097,k=Math.min(0.92*vw/P,0.78*vh/H);
  k=Math.max(1,k);
  var r=document.documentElement.style;
  r.setProperty('--P',P+'px');r.setProperty('--k',k.toFixed(4));
}
window.addEventListener('resize',layout);layout();

/* ---------- open / close ---------- */
function openCard(){
  if(isOpen)return;isOpen=true;
  clearTimeout(openTimer);
  leaf.classList.remove('hidden');
  book.classList.add('open');leaf.classList.add('open');
  hint.classList.add('hide');
  backBtn.classList.add('show');dock.classList.add('show');
  openTimer=setTimeout(function(){pageL.classList.add('show');leaf.classList.add('hidden')},1150);
}
function closeCard(){
  if(!isOpen)return;isOpen=false;
  clearTimeout(openTimer);
  tuckLetter(true);
  stopMic();holding=false;holdBtn.classList.remove('on');
  pageL.classList.remove('show');leaf.classList.remove('hidden');
  backBtn.classList.remove('show');dock.classList.remove('show');
  void leaf.offsetWidth;
  leaf.classList.remove('open');book.classList.remove('open');
  setTimeout(function(){if(!isOpen)hint.classList.remove('hide')},900);
  setTimeout(function(){if(!isOpen)resetCandles(true)},1200);
}
leaf.addEventListener('click',function(){if(!isOpen)openCard()});
backBtn.addEventListener('click',closeCard);

/* ---------- letter ---------- */
function liftLetter(){
  clearTimeout(letterTimer);letterUp=true;
  letter.classList.add('top');void letter.offsetWidth;letter.classList.add('up');
  
}
function tuckLetter(instant){
  clearTimeout(letterTimer);letterUp=false;
  letter.classList.remove('up');
  if(instant){letter.style.transition='none';letter.classList.remove('top');void letter.offsetWidth;letter.style.transition=''}
  else letterTimer=setTimeout(function(){letter.classList.remove('top')},820);
}
letter.addEventListener('click',function(e){e.stopPropagation();letterUp?tuckLetter():liftLetter()});

/* ---------- candles ---------- */
var flEls=FLAMES.map(function(f){
  var d=document.createElement('div');d.className='fl';
  d.style.left=(f.x/1135*100)+'%';d.style.top=(f.y/1600*100)+'%';d.style.width=(f.w/1135*100)+'%';
  d.style.transformOrigin=f.ox+'% 100%';
  var im=new Image();im.src=f.src;im.alt='';d.appendChild(im);cake.appendChild(d);return d;
});
var lit=[true,true,true,true],accum=0,blowAccum=0,lvlS=0,holding=false;
thrEl.style.left=(BLOW_THRESHOLD*100)+'%';

function resetCandles(quiet){
  lit=[true,true,true,true];accum=0;
  flEls.forEach(function(d){d.style.opacity=1});
  wish.classList.remove('show');
  var s=cake.querySelectorAll('.smoke');for(var i=0;i<s.length;i++)s[i].remove();
}
function extinguish(i){
  lit[i]=false;flEls[i].style.opacity=0;
  var f=FLAMES[i];
  for(var n=0;n<3;n++){
    var s=document.createElement('div');s.className='smoke';
    s.style.left=((f.x+f.w*f.ox/100)/1135*100+(n-1)*1.2)+'%';
    s.style.top=((f.y+f.h)/1600*100-5)+'%';
    s.style.animationDelay=(n*0.16)+'s';
    cake.appendChild(s);(function(el){setTimeout(function(){el.remove()},2200)})(s);
  }
  if(!lit.some(Boolean)){setTimeout(function(){wish.classList.add('show');burst()},380)}
}

/* ---------- blow input: mic + fallback ---------- */
var ctx=null,stream=null,analyser=null,tbuf=null,fbuf=null,micOn=false,floorDb=-60,calib=null,calibT=0;
function setNote(t){note.textContent=t}
if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  micBtn.disabled=true;micBtn.style.opacity=.5;
  setNote(location.protocol==='file:'?'mic needs https — host this file online. For now: hold the button or space to blow':'mic isn’t available here — hold the button or space to blow');
}else{setNote('turn on the mic and blow, or hold the button / space bar')}
function startMic(){
  if(micOn)return;
  micBtn.textContent='🎤 asking…';
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
    stream=s;ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.resume)ctx.resume();
    var src=ctx.createMediaStreamSource(s);analyser=ctx.createAnalyser();
    analyser.fftSize=2048;analyser.smoothingTimeConstant=0.2;src.connect(analyser);
    tbuf=new Float32Array(analyser.fftSize);fbuf=new Float32Array(analyser.frequencyBinCount);
    micOn=true;calib=[];calibT=performance.now();
    micBtn.textContent='🎤 mic on';micBtn.classList.add('on');
    setNote('listening… go ahead and blow ♥');
  }).catch(function(){
    micBtn.textContent='🎤 turn on mic';
    setNote('mic blocked — hold the button or space bar to blow instead');
  });
}
function stopMic(){
  if(stream){stream.getTracks().forEach(function(t){t.stop()})}
  if(ctx&&ctx.close)try{ctx.close()}catch(e){}
  stream=null;ctx=null;analyser=null;micOn=false;
  micBtn.textContent='🎤 turn on mic';micBtn.classList.remove('on');
}
micBtn.addEventListener('click',function(){micOn?stopMic():startMic()});
function micLevel(now){
  if(!micOn||!analyser)return 0;
  analyser.getFloatTimeDomainData(tbuf);
  var s=0;for(var i=0;i<tbuf.length;i++)s+=tbuf[i]*tbuf[i];
  var db=20*Math.log10(Math.sqrt(s/tbuf.length)+1e-8);
  if(calib){                       // first 0.7s: learn the room's noise floor
    calib.push(db);
    if(now-calibT>700){calib.sort(function(a,b){return a-b});floorDb=calib[Math.floor(calib.length/2)];calib=null}
    return 0;
  }
  if(db<floorDb)floorDb+=(db-floorDb)*0.3;else if(db<floorDb+6)floorDb+=(db-floorDb)*0.01;
  var raw=Math.max(0,Math.min(1,(db-floorDb-10)/22));
  // breath is noise-like (flat spectrum); speech is peaky — soften the level for peaky sounds
  analyser.getFloatFrequencyData(fbuf);
  var binHz=ctx.sampleRate/analyser.fftSize,a=Math.max(2,Math.round(100/binHz)),b=Math.round(3000/binHz),ls=0,ar=0,n=0;
  for(var j=a;j<b;j++){var p=Math.pow(10,fbuf[j]/10)+1e-14;ls+=Math.log(p);ar+=p;n++}
  var flat=Math.exp(ls/n)/(ar/n),g=Math.max(0,Math.min(1,(flat-0.12)/0.18));
  return raw*(0.3+0.7*g);
}
holdBtn.addEventListener('pointerdown',function(e){e.preventDefault();holding=true;holdBtn.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){holdBtn.addEventListener(ev,function(){holding=false;holdBtn.classList.remove('on')})});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'&&isOpen){e.preventDefault();if(!e.repeat){holding=true;holdBtn.classList.add('on')}}
  else if((e.key==='Enter'||e.key===' ')&&!isOpen&&document.activeElement===document.body){}
});
window.addEventListener('keyup',function(e){if(e.code==='Space'){holding=false;holdBtn.classList.remove('on')}});
window.addEventListener('blur',function(){holding=false;holdBtn.classList.remove('on')});

/* ---------- main loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  var raw=Math.max(micLevel(now),holding?0.85+0.1*Math.sin(now/70):0);
  lvlS+=(raw-lvlS)*(raw>lvlS?0.45:0.12);
  lvlEl.style.width=(lvlS*100).toFixed(1)+'%';
  var any=lit.some(Boolean);
  if(isOpen&&any){
    var blowing=lvlS>BLOW_THRESHOLD;
    accum=blowing?accum+dt:Math.max(0,accum-dt*1.5);
    var bend=Math.min(1,lvlS*1.25);
    for(var i=0;i<FLAMES.length;i++){
      if(!lit[i])continue;
      var t=now/1000,fl=Math.sin(t*7+i*1.7)*0.6+Math.sin(t*13+i)*0.4;
      var ang=bend*(27+i%2*4)+fl*(1.4+bend*2.5);
      var sk=-bend*3,sy=1-0.12*bend+fl*0.015;
      flEls[i].style.transform='rotate('+ang.toFixed(2)+'deg) skewX('+sk.toFixed(2)+'deg) scaleY('+sy.toFixed(3)+')';
      if(accum>=BLOW_SECONDS+i*0.035)extinguish(i);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- confetti ---------- */
var cv=$('confetti'),cx=cv.getContext('2d'),parts=[],run=false;
function fit(){var d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',fit);fit();
var COL=['#b79bdd','#8b6bb5','#e5daf2','#fbf3ea','#f1c6d8','#e8c96a','#cdb8ea'];
function burst(){
  for(var i=0;i<150;i++){
    var fromTop=i%3===0;
    parts.push({x:fromTop?Math.random()*innerWidth:innerWidth*(.3+Math.random()*.4),
      y:fromTop?-20:innerHeight*.55,vx:(Math.random()-.5)*(fromTop?3:14),vy:fromTop?Math.random()*2+1:-(Math.random()*13+6),
      w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COL[i%COL.length],life:0,round:Math.random()<.25});
  }
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.y<innerHeight+30&&p.life<420});
  parts.forEach(function(p){
    p.life++;p.vy+=.22;p.vx*=.992;p.vy*=.992;p.x+=p.vx+Math.sin(p.life/12+p.r)*.6;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,(420-p.life)/60);
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2.4,0,6.3);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  });
  if(parts.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}
window.__card={openCard:openCard,closeCard:closeCard,state:function(){return{isOpen:isOpen,letterUp:letterUp,lit:lit.slice(),accum:accum,lvl:lvlS,wish:wish.classList.contains('show')}}};
})();
